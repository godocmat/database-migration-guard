[package]
name = "dmg-cli"
description = "Offline PostgreSQL migration review and policy checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dmg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dmg-core = { path = "../dmg-core" }
dmg-discovery = { path = "../dmg-discovery" }
dmg-postgres = { path = "../dmg-postgres" }
dmg-report = { path = "../dmg-report" }
dmg-rules = { path = "../dmg-rules" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
toml.workspace = true
