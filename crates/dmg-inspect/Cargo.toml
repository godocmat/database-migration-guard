[package]
name = "dmg-inspect"
description = "Read-only PostgreSQL transport for Database Migration Guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror.workspace = true
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = "=0.14.0"
zeroize = "=1.9.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "net"] }
