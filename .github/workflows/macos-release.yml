name: Stage macOS GitHub release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing release tag such as v0.1.1
        required: true
        type: string
      source_commit:
        description: Full commit SHA approved for the release tag
        required: true
        type: string

permissions:
  contents: read

env:
  DMG_TARGET: aarch64-apple-darwin
  RELEASE_TAG: ${{ inputs.source_tag }}
  RELEASE_SOURCE: ${{ inputs.source_commit }}

jobs:
  package:
    name: Build and verify Apple silicon CLI
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.source.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match the approved release tag
        id: source
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$REF_PROTECTED" != true ||
                "$PRIVATE_REPOSITORY" != false || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ||
                ! "$RELEASE_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dispatch from public, protected main with an approved release tag and full commit SHA."
            exit 1
          fi
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SOURCE"
          git merge-base --is-ancestor "$RELEASE_SOURCE" "$GITHUB_SHA"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install pinned SBOM validation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/release-ci-requirements.txt
      - name: Reproduce and stage the tagged build
        shell: bash
        env:
          DMG_VERSION: ${{ steps.source.outputs.version }}
        run: |
          test "$(uname -m)" = arm64
          llvm=$(brew --prefix llvm@18)
          export LIBCLANG_PATH="$llvm/lib"
          export CLANG_PATH="$llvm/bin/clang"
          test -f "$LIBCLANG_PATH/libclang.dylib"
          sw_vers
          "$CLANG_PATH" --version
          xcrun clang --version
          xcrun --show-sdk-version

          source="$RUNNER_TEMP/dmg-release-source"
          inputs="$RUNNER_TEMP/dmg-inputs"
          git worktree add --detach "$source" "$RELEASE_SOURCE"
          mkdir "$inputs"
          python -B scripts/verify-release-ci.py --source "$source" --distribution "$DMG_VERSION" \
            "$DMG_TARGET" "$RELEASE_SOURCE" "$inputs/dmg-$DMG_VERSION-$DMG_TARGET.tar.gz"
      - name: Exercise the exact archive with networking denied
        shell: bash
        env:
          DMG_VERSION: ${{ steps.source.outputs.version }}
        run: |
          /usr/bin/sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python -B scripts/native_distribution.py --inputs "$RUNNER_TEMP/dmg-inputs" \
            --scratch "$RUNNER_TEMP" --source "$RELEASE_SOURCE" --version "$DMG_VERSION" --target "$DMG_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: dmg-macos-release-verified-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dmg-inputs/dmg-${{ steps.source.outputs.version }}-${{ env.DMG_TARGET }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest:
    name: Attest and verify the macOS download
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DMG_ARCHIVE: dmg-${{ needs.package.outputs.version }}-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/dmg-dist/
          merge-multiple: true
      - name: Record the workflow and tagged source in SLSA provenance
        shell: bash
        run: |
          jq -n --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" '
            {
              buildDefinition: {
                buildType: "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {repository: $repo, path: ".github/workflows/macos-release.yml", ref: env.GITHUB_REF},
                  inputs: {source_tag: env.RELEASE_TAG, source_commit: env.RELEASE_SOURCE}
                },
                resolvedDependencies: [
                  {uri: ("git+" + $repo + "@" + env.GITHUB_REF), digest: {gitCommit: env.GITHUB_SHA}},
                  {uri: ("git+" + $repo + "@refs/tags/" + env.RELEASE_TAG), digest: {gitCommit: env.RELEASE_SOURCE}}
                ]
              },
              runDetails: {
                builder: {id: (env.GITHUB_SERVER_URL + "/" + env.GITHUB_WORKFLOW_REF)},
                metadata: {invocationId: $run}
              }
            }' > "$RUNNER_TEMP/dmg-macos-predicate.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: ${{ runner.temp }}/dmg-dist/${{ env.DMG_ARCHIVE }}
          predicate-path: ${{ runner.temp }}/dmg-macos-predicate.json
          predicate-type: https://slsa.dev/provenance/v1
      - name: Verify the attestation and the signed source pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cd "$RUNNER_TEMP/dmg-dist"
          gh attestation verify "$DMG_ARCHIVE" --bundle "$DMG_PROVENANCE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/macos-release.yml" \
            --signer-digest "$GITHUB_SHA" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1 --format json \
            > "$RUNNER_TEMP/dmg-macos-verified.json"
          jq -e --arg uri "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@refs/tags/$RELEASE_TAG" \
            --arg source "$RELEASE_SOURCE" \
            'any(.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[];
               .uri == $uri and .digest.gitCommit == $source)' "$RUNNER_TEMP/dmg-macos-verified.json"
          cp "$DMG_PROVENANCE" macos-provenance.jsonl
          sha256sum "$DMG_ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-${{ inputs.source_tag }}-macos-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dmg-dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0