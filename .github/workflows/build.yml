name: Build

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # pg_query 18.1.0 uses the bundled Protobuf bindings when this is set.
      DOCS_RS: '1'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locate Ubuntu libclang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          libclang=/usr/lib/llvm-18/lib
          clang=/usr/bin/clang-18
          if [[ ! -f "$libclang/libclang.so" || ! -x "$clang" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends clang-18 libclang-18-dev
          fi
          test -f "$libclang/libclang.so"
          test -f "$("$clang" -print-resource-dir)/include/stdbool.h"
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$clang" >> "$GITHUB_ENV"
      - name: Locate macOS libclang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          libclang="$(brew --prefix llvm@18)/lib"
          test -f "$libclang/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          $libclang = Join-Path $llvmBin 'libclang.dll'
          if (-not (Test-Path -LiteralPath $libclang -PathType Leaf)) {
            $clang = Get-Command clang.exe -ErrorAction Stop
            $llvmBin = Split-Path -Parent $clang.Source
            $libclang = Join-Path $llvmBin 'libclang.dll'
          }
          if (-not (Test-Path -LiteralPath $libclang -PathType Leaf)) {
            throw 'LLVM libclang.dll was not found'
          }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
      - name: Select the pinned toolchain
        run: rustc -Vv
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --workspace
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test contracts
        run: cargo test --locked --workspace
      - name: Verify discovery corpus
        if: runner.os == 'Linux'
        run: cargo test --locked -p dmg-discovery --test corpus -- --ignored
      - name: Verify offline risk corpus
        if: runner.os == 'Linux'
        run: cargo test --locked -p dmg-rules --test corpus -- --ignored
