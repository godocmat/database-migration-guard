name: Stage native GitHub release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit SHA approved for release from protected main
        required: true
        type: string

permissions:
  contents: read

env:
  DMG_VERSION: '0.1.0'

jobs:
  source:
    name: Verify protected release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Match the approved source
        shell: bash
        env:
          APPROVED_SOURCE: ${{ inputs.source_commit }}
          REF_PROTECTED: ${{ github.ref_protected }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$REF_PROTECTED" != true ||
                "$PRIVATE_REPOSITORY" != false || ! "$APPROVED_SOURCE" =~ ^[0-9a-f]{40}$ ||
                "$GITHUB_SHA" != "$APPROVED_SOURCE" ]]; then
            echo "::error::Dispatch from public, protected main with its approved full source SHA."
            exit 1
          fi
          echo "Staging dmg ${DMG_VERSION} at ${GITHUB_SHA}"

  build:
    name: Stage release (${{ matrix.target }})
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
    env:
      DMG_TARGET: ${{ matrix.target }}
      DMG_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install pinned SBOM validation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/release-ci-requirements.txt
      - name: Build and stage on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          export CLANG_PATH=/usr/bin/clang-18
          if [[ ! -f "$LIBCLANG_PATH/libclang.so.1" || ! -x "$CLANG_PATH" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends clang-18 libclang-18-dev
          fi
          test -f "$LIBCLANG_PATH/libclang.so.1"
          test -f "$("$CLANG_PATH" -print-resource-dir)/include/stdbool.h"
          gcc --version
          ld --version
          dpkg-query -W libclang1-18
          inputs="$RUNNER_TEMP/dmg-inputs"
          mkdir "$inputs"
          python -B scripts/verify-release-ci.py --distribution "$DMG_VERSION" "$DMG_TARGET" "$GITHUB_SHA" \
            "$inputs/dmg-$DMG_VERSION-$DMG_TARGET.$DMG_EXTENSION"
      - name: Build and stage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'MSVC is unavailable' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:LIBCLANG_PATH = Join-Path $env:ProgramFiles 'LLVM/bin'
          $env:CLANG_PATH = Join-Path $env:LIBCLANG_PATH 'clang.exe'
          (Get-Item -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll')).VersionInfo |
            Select-Object FileVersion, ProductVersion
          Get-Command cl.exe, link.exe | ForEach-Object { (Get-Item -LiteralPath $_.Source).VersionInfo } |
            Select-Object FileVersion, ProductVersion
          Write-Output "Windows SDK $env:WindowsSDKVersion"
          $inputs = Join-Path $env:RUNNER_TEMP 'dmg-inputs'
          New-Item -ItemType Directory -Path $inputs | Out-Null
          $asset = "dmg-$env:DMG_VERSION-$env:DMG_TARGET.$env:DMG_EXTENSION"
          python -B scripts/verify-release-ci.py --distribution $env:DMG_VERSION $env:DMG_TARGET $env:GITHUB_SHA (Join-Path $inputs $asset)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-release-inputs-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/dmg-inputs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  verify:
    name: Verify clean install and rollback (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
    env:
      DMG_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg-release-inputs-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/dmg-inputs/
      - name: Exercise the exact archive
        shell: bash
        run: |
          python -B scripts/native_distribution.py --inputs "$RUNNER_TEMP/dmg-inputs" \
            --scratch "$RUNNER_TEMP" --source "$GITHUB_SHA" --version "$DMG_VERSION" --target "$DMG_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-release-verified-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/dmg-inputs/dmg-${{ env.DMG_VERSION }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  attest:
    name: Attest and verify release downloads
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dmg-release-verified-*-${{ github.sha }}
          path: ${{ runner.temp }}/dmg-dist/
          merge-multiple: true
      - name: Hash the verified downloads
        shell: bash
        run: |
          cd "$RUNNER_TEMP/dmg-dist"
          files=(*)
          test "${#files[@]}" = 2
          sha256sum "dmg-$DMG_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "dmg-$DMG_VERSION-x86_64-pc-windows-msvc.zip" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            ${{ runner.temp }}/dmg-dist/dmg-${{ env.DMG_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/dmg-dist/dmg-${{ env.DMG_VERSION }}-x86_64-pc-windows-msvc.zip
            ${{ runner.temp }}/dmg-dist/SHA256SUMS
      - name: Verify protected source provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cd "$RUNNER_TEMP/dmg-dist"
          for subject in *.tar.gz *.zip SHA256SUMS; do
            gh attestation verify "$subject" --bundle "$DMG_PROVENANCE" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-release.yml" \
              --signer-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          cp "$DMG_PROVENANCE" provenance.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-v${{ env.DMG_VERSION }}-${{ github.sha }}
          path: ${{ runner.temp }}/dmg-dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
