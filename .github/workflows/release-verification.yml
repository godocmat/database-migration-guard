name: Verify native release candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    if: ${{ github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: Native package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      DMG_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install pinned SBOM validation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/release-ci-requirements.txt
      - name: Verify native package on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          export CLANG_PATH=/usr/bin/clang-18
          if [[ ! -f "$LIBCLANG_PATH/libclang.so" || ! -x "$CLANG_PATH" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends clang-18 libclang-18-dev
          fi
          test -f "$LIBCLANG_PATH/libclang.so"
          test -f "$("$CLANG_PATH" -print-resource-dir)/include/stdbool.h"
          gcc --version
          ld --version
          dpkg-query -W libclang1-18
          python -B scripts/verify-release-ci.py "$DMG_TARGET" "$GITHUB_SHA" "$RUNNER_TEMP/dmg-native.tar.gz"
      - name: Verify native package on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          llvm=$(brew --prefix llvm@18)
          export LIBCLANG_PATH="$llvm/lib"
          export CLANG_PATH="$llvm/bin/clang"
          test -f "$LIBCLANG_PATH/libclang.dylib"
          "$CLANG_PATH" --version
          xcrun clang --version
          xcrun --show-sdk-version
          python -B scripts/verify-release-ci.py "$DMG_TARGET" "$GITHUB_SHA" "$RUNNER_TEMP/dmg-native.tar.gz"
      - name: Verify native package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'MSVC is unavailable' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:LIBCLANG_PATH = Join-Path $env:ProgramFiles 'LLVM/bin'
          $env:CLANG_PATH = Join-Path $env:LIBCLANG_PATH 'clang.exe'
          $libclang = Get-Item -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll')
          $libclang.VersionInfo | Select-Object FileVersion, ProductVersion
          Get-Command cl.exe, link.exe | ForEach-Object { (Get-Item -LiteralPath $_.Source).VersionInfo } | Select-Object FileVersion, ProductVersion
          Write-Output "Windows SDK $env:WindowsSDKVersion"
          python -B scripts/verify-release-ci.py $env:DMG_TARGET $env:GITHUB_SHA (Join-Path $env:RUNNER_TEMP 'dmg-native.tar.gz')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-native-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/dmg-native.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  rustsec:
    if: ${{ github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: Locked Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Stage pinned auditor and advisory database
        shell: bash
        env:
          RUSTSEC_DB_COMMIT: 4ef2df8e806a65e2f1ecc14f56f51249062b23d6
          AUDITOR_ARCHIVE_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          root="$RUNNER_TEMP/dmg-audit"
          mkdir -p "$root/tool" "$root/db"
          url=https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          curl --disable --fail --silent --show-error --location --proto '=https' --max-time 60 "$url" -o "$root/audit.tgz"
          printf '%s  %s\n' "$AUDITOR_ARCHIVE_SHA256" "$root/audit.tgz" | sha256sum --check --strict
          tar -xzf "$root/audit.tgz" -C "$root/tool" --strip-components=1
          git -C "$root/db" init --quiet
          git -C "$root/db" fetch --no-tags --depth=1 https://github.com/RustSec/advisory-db.git "$RUSTSEC_DB_COMMIT"
          git -C "$root/db" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$root/db" rev-parse HEAD)" = "$RUSTSEC_DB_COMMIT"
          printf '%s\n' "$RUSTSEC_DB_COMMIT" > "$root/advisory-db-commit.txt"
      - name: Audit Cargo.lock
        id: audit
        shell: bash
        run: |
          root="$RUNNER_TEMP/dmg-audit"
          "$root/tool/cargo-audit" audit --no-fetch --no-yanked --db "$root/db" --file Cargo.lock --json > "$root/cargo-audit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        with:
          name: dmg-rustsec-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dmg-audit/cargo-audit.json
            ${{ runner.temp }}/dmg-audit/advisory-db-commit.txt
          if-no-files-found: error
          retention-days: 14
