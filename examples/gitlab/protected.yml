# Include from an organization-owned Pipeline Execution Policy by full commit SHA.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

dmg:protected:
  stage: test
  image: registry.gitlab.com/your-org/migration-ci/dmg@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  variables:
    GIT_STRATEGY: empty
    GIT_SUBMODULE_STRATEGY: none
    CI_DEBUG_TRACE: "false"
    CI_DEBUG_SERVICES: "false"
    DMG_GITLAB_ORIGIN: "https://gitlab.com"
    DMG_GITLAB_PROJECT_ID: "12345"
    DMG_GITLAB_PROJECT_PATH: "your-org/application"
    DMG_GITLAB_TARGET_BRANCH: "main"
    DMG_CONFIG_PATH: ".dmg/dmg.toml"
    DMG_POLICY_PATH: ".dmg/policy.toml"
    DMG_BINARY_SHA256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  dependencies: []
  cache: []
  timeout: 10m
  allow_failure: false
  script:
    - PATH=/usr/local/bin:/usr/bin:/bin /usr/local/bin/python3 -I /opt/dmg/gate.py protected
  artifacts:
    when: always
    access: maintainer
    expire_in: 7 days
    paths:
      - dmg-reports/report.json
      - dmg-reports/report.md
      - dmg-reports/provenance.json
