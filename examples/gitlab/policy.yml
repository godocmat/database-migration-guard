pipeline_execution_policy:
  - name: Database Migration Guard
    description: Check the exact same-project merged result using the protected migration policy.
    enabled: true
    pipeline_config_strategy: override_project_ci
    # Replace the project and full commit with the reviewed CI configuration.
    content:
      include:
        - project: your-org/migration-ci
          file: /examples/gitlab/protected.yml
          ref: "0123456789abcdef0123456789abcdef01234567"
    # Replace with the immutable numeric ID of the project to protect.
    policy_scope:
      projects:
        including:
          - id: 12345
    suffix: never
    skip_ci:
      allowed: false
    no_pipeline:
      allowed: false
    variables_override:
      allowed: false
