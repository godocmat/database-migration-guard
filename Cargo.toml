[workspace]
members = ["crates/dmg-core", "crates/dmg-discovery"]
exclude = ["spikes/dmg-01-parser"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
toml = "0.9"
